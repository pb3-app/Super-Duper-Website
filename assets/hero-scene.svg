<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 20 1290 520" width="1290" height="520" role="img" aria-label="The Tung log mascot with a bat, standing among a snake, a minesweeper board, clue chips and a Sprouts drawing">
  <defs>
