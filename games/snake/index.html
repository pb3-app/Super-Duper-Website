<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Tung Snake</title>
  <link rel="stylesheet" href="../game.css" />
  <link rel="stylesheet" href="../../mp.css" />
  <style>
    #board {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1;
      border-radius: 14px;
      border: 4px solid var(--wood-light);
      box-shadow: 0 8px 0 #4a2a10, 0 14px 30px rgba(0,0,0,.5);
      background: #1b1030;
      touch-action: none;
      display: block;
      margin: 0 auto;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(2, 60px);
      gap: 6px;
      justify-content: center;
      margin-top: 1.25rem;
    }
    .dpad button { font-size: 1.5rem; padding: 0; }
    .dpad .up { grid-column: 2; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body data-game="snake">
  <div class="stars" aria-hidden="true"></div>
  <div class="game-page">
    <div class="game-top">
      <a class="back" href="../../index.html#games">← Games</a>
      <h1>🐍 Tung Snake</h1>
      <div id="mpSlot"></div>
    </div>

    <div class="mode-switch" id="modeSwitch">
      <button class="btn secondary active" data-mode="single">🎮 Single Player</button>
      <button class="btn secondary" data-mode="multi">👥 Multiplayer</button>
    </div>
    <div class="mp-lobby" id="mpLobby" hidden></div>
    <div class="mp-matchbar" id="mpMatchBar" hidden></div>

    <div id="gameArea">
    <div class="hud">
      <span class="chip">🥁 Score: <b id="score">0</b></span>
      <span class="chip">🏆 Best: <b id="best">0</b></span>
      <button class="btn" id="startBtn">Start</button>
    </div>
    <section class="controls" aria-label="Controls">
        <h2>🎮 Controls</h2>
        <div class="ctl-grid">
          <div class="ctl"><span class="keys"><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span class="act">Steer the snake</span></div><div class="ctl"><span class="keys"><kbd>Space</kbd></span><span class="act">Start / restart</span></div>
        </div>
        <p class="ctl-extra">📱 <b>Touch:</b> swipe on the board, or use the on-screen arrow pad.</p>
      </section>
    <div class="overlay-msg" id="msg">Press Start or Space</div>

    <canvas id="board" width="480" height="480"></canvas>

    <div class="dpad">
      <button class="btn secondary up" data-dir="up">▲</button>
      <button class="btn secondary left" data-dir="left">◀</button>
      <button class="btn secondary down" data-dir="down">▼</button>
      <button class="btn secondary right" data-dir="right">▶</button>
    </div>

    <p class="help">Arrow keys / WASD to move · Space to start/pause · Swipe on mobile</p>
    </div>

    <div id="gameLeaderboard"></div>
  </div>

  <script src="../../mp.js"></script>
  <script src="snake.js"></script>
</body>
</html>
